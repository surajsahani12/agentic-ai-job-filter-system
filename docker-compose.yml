services:
  postgres:
    image: postgres:17-alpine
    container_name: job_automation_db
    environment:
      POSTGRES_USER: suraj
      POSTGRES_PASSWORD: surajsahani
      POSTGRES_DB: job_automation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: job_automation_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
